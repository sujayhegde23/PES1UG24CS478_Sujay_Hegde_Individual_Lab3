<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140"><rect width="1400" height="1140" fill="white"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e293b" text-anchor="start">Self-Service Coffee Kiosk System</text><text x="40" y="80" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#1e293b" text-anchor="start">Lab 3 - UML Component Diagram | Sujay Hegde | PES1UG24CS478 | Layered Architecture</text><rect x="40" y="115" width="1320" height="190" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="60" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="start">Presentation layer</text><rect x="40" y="360" width="1320" height="205" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="60" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#15803d" text-anchor="start">Application / business layer</text><rect x="40" y="675" width="1320" height="210" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="60" y="870" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#b45309" text-anchor="start">Infrastructure / data layer</text><rect x="450" y="170" width="500" height="105" fill="white" stroke="#2563eb" stroke-width="2"/><text x="700" y="193" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">«component»</text><text x="700" y="217" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">User Interface</text><text x="700" y="242" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Touchscreen: Espresso / Americano / Latte</text><text x="700" y="261" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Small / Large; show order and payment status</text><rect x="450" y="420" width="500" height="105" fill="white" stroke="#15803d" stroke-width="2"/><text x="700" y="443" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">«component»</text><text x="700" y="467" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Order Manager</text><text x="700" y="492" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Validate selection; calculate amount; coordinate checkout</text><text x="700" y="511" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Request payment; print receipt after approval</text><rect x="95" y="730" width="350" height="105" fill="white" stroke="#b45309" stroke-width="2"/><text x="270" y="753" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">«component»</text><text x="270" y="777" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Payment Service</text><text x="270" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Credit-card authorization via terminal SDK</text><text x="270" y="821" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Return result and transaction reference</text><rect x="525" y="730" width="350" height="105" fill="white" stroke="#b45309" stroke-width="2"/><text x="700" y="753" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">«component»</text><text x="700" y="777" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Menu Repository</text><text x="700" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Store coffee types, sizes, and prices</text><text x="700" y="821" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Read menu and prices via database queries</text><rect x="955" y="730" width="350" height="105" fill="white" stroke="#b45309" stroke-width="2"/><text x="1130" y="753" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle">«component»</text><text x="1130" y="777" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Receipt Printer</text><text x="1130" y="802" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Format order details; report print status</text><text x="1130" y="821" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">USB/serial hardware driver</text><polyline points="700,275 700,318" fill="none" stroke="#334155" stroke-width="2"/><polyline points="700,345 700,420" fill="none" stroke="#334155" stroke-width="2"/><path d="M 686,332 A 14,14 0 0 1 714,332" fill="none" stroke="#334155" stroke-width="2"/><circle cx="700" cy="335" r="9" fill="white" stroke="#334155" stroke-width="2"/><text x="730" y="325" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Order Interface</text><text x="730" y="346" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e293b" text-anchor="start">Local API: getMenu(), submitOrder(), getStatus()</text><polyline points="475,525 475,582 270,582 270,601" fill="none" stroke="#334155" stroke-width="2"/><polyline points="270,628 270,730" fill="none" stroke="#334155" stroke-width="2"/><path d="M 256,615 A 14,14 0 0 1 284,615" fill="none" stroke="#334155" stroke-width="2"/><circle cx="270" cy="618" r="9" fill="white" stroke="#334155" stroke-width="2"/><text x="295" y="610" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Payment Interface</text><text x="295" y="631" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">processPayment()</text><text x="295" y="647" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">Local API / terminal SDK</text><polyline points="700,525 700,601" fill="none" stroke="#334155" stroke-width="2"/><polyline points="700,628 700,730" fill="none" stroke="#334155" stroke-width="2"/><path d="M 686,615 A 14,14 0 0 1 714,615" fill="none" stroke="#334155" stroke-width="2"/><circle cx="700" cy="618" r="9" fill="white" stroke="#334155" stroke-width="2"/><text x="725" y="610" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Menu Interface</text><text x="725" y="631" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">getMenu(), getPrice()</text><text x="725" y="647" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">Repository API / SQL</text><polyline points="925,525 925,582 1130,582 1130,601" fill="none" stroke="#334155" stroke-width="2"/><polyline points="1130,628 1130,730" fill="none" stroke="#334155" stroke-width="2"/><path d="M 1116,615 A 14,14 0 0 1 1144,615" fill="none" stroke="#334155" stroke-width="2"/><circle cx="1130" cy="618" r="9" fill="white" stroke="#334155" stroke-width="2"/><text x="1155" y="610" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="start">Receipt Interface</text><text x="1155" y="631" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">printReceipt(), getPrinterStatus()</text><text x="1155" y="647" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e293b" text-anchor="start">Local API / USB/serial driver</text><text x="40" y="925" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#1e293b" text-anchor="start">Notation: hollow ball = provided interface; semicircle = required interface; solid stems = assembly connection.</text><text x="40" y="951" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#1e293b" text-anchor="start">Requests go from consumer (socket) to provider (ball); results return through the same interface.</text><text x="40" y="985" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="start">Checkout flow</text><text x="40" y="1012" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#1e293b" text-anchor="start">1. Read menu and prices   2. Select coffee and size   3. Authorize credit card   4. Print receipt after approval</text><text x="40" y="1041" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#1e293b" text-anchor="start">Declined payment: show failure. Printer failure after payment: retry printing without charging again.</text><text x="40" y="1082" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Logical layers within one kiosk application. External payment authorization may require network access.</text></svg>